name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PyQt6 غير لازم للاختبارات — الواجهة لا تُختبر في CI
      - run: pip install "PyMuPDF>=1.24,<2" "numpy>=1.24,<3" pytest
      - run: pytest -q
