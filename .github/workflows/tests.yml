name: tests

on:
  push:
  pull_request:

# الـActions مثبَّتة ببصمة الالتزام لا بوسم الإصدار. الوسم `v4` مرجعٌ
# متحرّك يملك صاحبُ الـaction تحريكه في أي لحظة، وهذا المستودع ينشر منه
# موقعًا عامًّا — فوسمٌ مُستبدَل يعني شيفرة غريبة تعمل في سلسلة النشر.
# البصمة لا تتحرّك. والتعليق بجانبها يقول أي إصدار هي، وDependabot يرفع
# PR بترقيتها كما يفعل مع الوسوم (انظر .github/dependabot.yml).
# الـworkflow لا يستعمل GITHUB_TOKEN إطلاقًا، ويشتغل على pull_request من
# التفرّعات — فالصلاحية الافتراضية (قد تكون كتابة) زائدة بلا مقابل.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # وظيفة المحرّك: بلا PyQt6 عمدًا — تثبت أن سطر الأوامر يعمل بدونه.
      # اختبارات الواجهة تُتخطّى هنا وتشتغل في وظيفة gui المستقلة أدناه.
      - run: pip install "PyMuPDF>=1.26,<2" "numpy>=1.24,<3" pytest coverage
      # بوابة تغطية لا تقرير: الانحدار الصامت — دالّة تُضاف بلا اختبار، أو
      # اختبار يُحذف مع كوده — كان يمرّ من CI أخضر. الواجهة الرسومية مستثناة
      # لأنها لا تُستورَد أصلًا في هذه الوظيفة (بلا PyQt6)، فتُقاس صفرًا
      # وتسحب الإجمالي معها؛ وظيفة gui أدناه هي التي تحرسها.
      - run: coverage run --source=src --omit="src/gui*.py" -m pytest -q
      - run: coverage report --omit="src/gui*.py" --fail-under=80

  # الواجهة تُختبر بقناة offscreen في Qt: نافذة كاملة بلا خادم عرض. بلا هذه
  # الوظيفة كانت اختبارات gui تُتخطّى في CI فلا تحرس شيئًا — وgui.py أكبر
  # ملف في المشروع.
  gui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # مكتبات النظام التي يربطها Qt6 ولا تأتي مع العدّاء افتراضيًا
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install "PyMuPDF>=1.26,<2" "numpy>=1.24,<3" "PyQt6>=6.6,<7" pytest
      - run: pytest tests/test_gui.py -q

  # جافاسكربت الصفحة كان بلا اختبار إطلاقًا، ومرّ منه عيبان يُجمّدان الواجهة
  # تجمّدًا دائمًا. الخيط العامل يُستبدَل بكائن وهمي، فتُختبر آلة الحالات
  # كلها بلا متصفّح ولا Pyodide — ومعها كاتب ZIP يفكّه بايثون للتحقّق.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: node --test tests/js/engine.test.mjs tests/js/zip.test.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # الأداة تحلّل ملفات PDF غير موثوقة عبر MuPDF (مكتبة C) — فحص الثغرات
      # المعروفة في الاعتماديات تنبيه لا بوابة، حتى لا تتعطّل الدفعات على
      # ثغرة في اعتمادية غير مباشرة لا إصلاح لها بعد.
      - run: pip-audit -r requirements.txt || true
