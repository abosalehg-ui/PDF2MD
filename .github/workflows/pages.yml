name: pages

# ينشر واجهة الويب على GitHub Pages.
#
# ⚠ خطوة يدوية لازمة مرة واحدة قبل أول نشرة ناجحة:
#   Settings → Pages → Build and deployment → Source = GitHub Actions
#
# ولا سبيل إلى أتمتتها من هنا: تفعيل Pages يمرّ بواجهة
# «Create a GitHub Pages site» وهي تطلب صلاحية إدارة المستودع
# (administration: write)، و GITHUB_TOKEN لا يملكها ولا تُمنح له. جُرّبت
# `enablement: true` على هذا المستودع فعلًا فردّت:
#   Create Pages site failed. Error: Resource not accessible by integration
# فأُزيلت: أتمتةٌ لا تعمل تُبدّل رسالة خطأ واضحة تقول «فعّل Pages» برسالة
# غامضة تقول «مورد غير متاح».

# الـActions مثبَّتة ببصمة الالتزام لا بوسم الإصدار. الوسم `v4` مرجعٌ
# متحرّك يملك صاحبُ الـaction تحريكه في أي لحظة، وهذا المستودع ينشر منه
# موقعًا عامًّا — فوسمٌ مُستبدَل يعني شيفرة غريبة تعمل في سلسلة النشر.
# البصمة لا تتحرّك. والتعليق بجانبها يقول أي إصدار هي، وDependabot يرفع
# PR بترقيتها كما يفعل مع الوسوم (انظر .github/dependabot.yml).

on:
  push:
    branches: [main]
    # الدفعة التي لا تمسّ الصفحة ولا المحرّك لا تستحق نشرًا جديدًا
    paths:
      - "index.html"
      - "web/**"
      - "src/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل وقت، وبلا إلغاء الجارية: إلغاء نشرة في منتصفها يترك
# الموقع المنشور على حالة نصفية.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # حارس: الصفحة تشغّل src/web.py نفسه، وسقوط اختباراته يعني موقعًا
      # معطوبًا بلا أن يُخطئ أي شيء في خطوة البناء.
      - name: اختبار جسر الويب
        run: |
          pip install "PyMuPDF>=1.26,<2" "numpy>=1.24,<3" pytest
          pytest tests/test_web.py -q

      # يُنزّل زمن التشغيل (Pyodide و numpy و PyMuPDF بصيغة wasm) ويتحقّق
      # من بصمة كل ملف، ثم يجمّع _site
      - name: بناء الموقع
        run: python3 tools/build_site.py --fetch

      # تسقط هنا برسالة صريحة إن لم يكن Pages مفعّلًا على المستودع — انظر
      # الخطوة اليدوية في أعلى الملف. السقوط مقصود: نشرةٌ تمضي وتترك الموقع
      # غير منشور أسوأ من نشرة تقف وتقول السبب.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
